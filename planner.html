<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สร้างแผน · FitStart AI</title>
<meta name="description" content="ให้ AI จัดตารางออกกำลังกายรายสัปดาห์ตามเป้าหมาย เวลา และอุปกรณ์ของคุณ">
<meta name="theme-color" content="#7c3aed">
<meta property="og:title" content="FitStart AI">
<meta property="og:description" content="ให้ AI จัดตารางออกกำลังกายรายสัปดาห์ตามเป้าหมาย เวลา และอุปกรณ์ของคุณ">
<meta property="og:image" content="img/logo.svg">
<link rel="icon" href="img/logo.svg?v=202611091352" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=Kanit:ital,wght@1,700;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=202611091352">
</head>
<body data-page="plan">

<main>
  <div class="wrap page-hero">
    <div>
      <span class="pill"><span data-i18n="planPill"></span></span>
      <h1 data-i18n="planTitle"></h1>
      <p class="lead" data-i18n="planSub"></p>
    </div>
  </div>

  <section class="tight">
    <div class="wrap">
      <div class="panel">
        <form id="planForm">
          <div class="pf">
            <div class="pf-q pf-wide">
              <div class="pf-label"><span class="pf-n">1</span><span data-i18n="qGoal"></span></div>
              <div class="opt-cards c4" data-group="goal"></div>
            </div>
            <div class="pf-q">
              <div class="pf-label"><span class="pf-n">2</span><span data-i18n="qLevel"></span></div>
              <div class="segm" data-group="level"></div>
            </div>
            <div class="pf-q">
              <div class="pf-label"><span class="pf-n">3</span><span data-i18n="qDays"></span></div>
              <div class="segm" data-group="days"></div>
            </div>
            <div class="pf-q">
              <div class="pf-label"><span class="pf-n">4</span><span data-i18n="qTime"></span></div>
              <div class="segm" data-group="time"></div>
            </div>
            <div class="pf-q">
              <div class="pf-label"><span class="pf-n">5</span><span data-i18n="qEquip"></span></div>
              <div class="opt-cards c3 small" data-group="equip"></div>
            </div>
            <div class="pf-q pf-wide">
              <label class="pf-switch" data-group="impact"></label>
            </div>
          </div>
          <button type="submit" class="btn big pf-go"><i data-icon="sparkle"></i><span data-i18n="generate"></span></button>
        </form>
        <div id="plan" aria-live="polite"></div>
      </div>
    </div>
  </section>

  <!-- My plans (logged-in only) -->
  <section id="myplans" hidden>
    <div class="wrap">
      <div class="sec-head">
        <h2 data-i18n="myPlans"></h2>
        <p data-i18n="myPlansSub"></p>
      </div>
      <div class="saved-list" id="savedList"></div>
    </div>
  </section>
</main>

<script src="js/i18n.js?v=202611091352"></script>
<script src="js/data.js?v=202611091352"></script>
<script src="js/utils.js?v=202611091352"></script>
<script src="js/icons.js?v=202611091352"></script>
<script src="js/figures.js?v=202611091352"></script>
<script src="js/layout.js?v=202611091352"></script>
<script src="js/auth.js?v=202611091352"></script>
<script src="js/planner.js?v=202611091352"></script>
<script src="js/workout.js?v=202611091352"></script>
<script src="js/progress.js?v=202611091352"></script>
<script src="js/coach.js?v=202611091352"></script>
<script src="js/main.js?v=202611091352"></script>
</body>
</html>
