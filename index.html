<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitStart AI</title>
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=Kanit:ital,wght@1,700;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=202611052010">
</head>
<body data-page="home">
<!-- ส่วนหัว เมนู และส่วนท้าย ถูกเพิ่มอัตโนมัติจาก js/layout.js -->

<main>
  <!-- Hero -->
  <div class="wrap hero">
    <div>
      <span class="pill"><span data-i18n="heroPill"></span></span>
      <h1 data-i18n-html="heroTitle"></h1>
      <p class="lead" data-i18n="heroLead"></p>
      <div class="btn-row">
        <a href="planner.html" class="btn" data-i18n="heroCta"></a>
        <a href="#topics" class="btn ghost" data-i18n="heroCta2"></a>
      </div>
    </div>
    <div class="ton-stage" aria-hidden="true">
      <span class="ton-ring"></span>
      <span class="ton-plate"></span>
      <img class="ton-img" src="img/ton.png" alt="">
      <div class="ton-bubble"><b data-i18n="tonHi"></b><span data-i18n="tonHiSub"></span></div>
      <div class="ton-chip c1"><b data-ex-count></b><small data-i18n="statEx"></small></div>
      <div class="ton-chip c2"><b>0฿</b><small data-i18n="statFree"></small></div>
      <div class="ton-chip c3"><b>AI</b><small data-i18n="tonChipAi"></small></div>
    </div>
  </div>

  <!-- Categories -->
  <section id="topics">
    <div class="wrap">
      <div class="sec-head">
        <h2 data-i18n="catTitle"></h2>
        <p data-i18n="catSub"></p>
      </div>
      <!-- Banner tiles: 4 square + 6 wide -->
      <div class="tiles-sq">
        <a class="tile sq" href="for-you.html">
          <img class="tile-logo" src="img/logo.svg" alt="">
          <div class="tile-art ton-art"><img src="img/ton.png" alt=""></div>
          <div class="tile-title" data-i18n="tq1"></div>
          <span class="tile-pill" data-i18n="tq1s"></span>
        </a>
        <a class="tile sq" href="planner.html">
          <img class="tile-logo" src="img/logo.svg" alt="">
          <div class="tile-art"><div class="fig" data-fig="jj"></div></div>
          <div class="tile-title" data-i18n="tq2"></div>
          <span class="tile-pill" data-i18n="tq2s"></span>
        </a>
        <a class="tile sq" href="bmi.html">
          <img class="tile-logo" src="img/logo.svg" alt="">
          <div class="tile-art"><div class="fig" data-fig="calf"></div></div>
          <div class="tile-title" data-i18n="tq3"></div>
          <span class="tile-pill" data-i18n="tq3s"></span>
        </a>
        <a class="tile sq" href="muscle.html#groups">
          <img class="tile-logo" src="img/logo.svg" alt="">
          <div class="tile-art"><div class="fig" data-fig="pushup"></div></div>
          <div class="tile-title"><span data-i18n="tq4"></span> <span class="tile-num" data-ex-count></span></div>
          <span class="tile-pill" data-i18n="tq4s"></span>
        </a>
      </div>
      <div class="tiles-wide">
        <a class="tile wide" href="muscle.html">
          <img class="tile-logo" src="img/logo.svg" alt="">
          <div class="tile-badge"><div class="fig" data-fig="curl"></div></div>
          <div class="tile-text"><div class="tile-l1" data-i18n="tw1a"></div><div class="tile-l2" data-i18n="tw1b"></div><span class="tile-pill" data-i18n="tw1s"></span></div>
        </a>
        <a class="tile wide" href="weight-loss.html">
          <img class="tile-logo" src="img/logo.svg" alt="">
          <div class="tile-badge"><div class="fig" data-fig="run"></div></div>
          <div class="tile-text"><div class="tile-l1" data-i18n="tw2a"></div><div class="tile-l2" data-i18n="tw2b"></div><span class="tile-pill" data-i18n="tw2s"></span></div>
        </a>
        <a class="tile wide" href="planner.html?equip=none">
          <img class="tile-logo" src="img/logo.svg" alt="">
          <div class="tile-badge"><div class="fig" data-fig="squat"></div></div>
          <div class="tile-text"><div class="tile-l1" data-i18n="tw3a"></div><div class="tile-l2" data-i18n="tw3b"></div><span class="tile-pill" data-i18n="tw3s"></span></div>
        </a>
        <a class="tile wide" href="more.html#timer">
          <img class="tile-logo" src="img/logo.svg" alt="">
          <div class="tile-badge"><div class="fig" data-fig="plank"></div></div>
          <div class="tile-text"><div class="tile-l1" data-i18n="tw4a"></div><div class="tile-l2" data-i18n="tw4b"></div><span class="tile-pill" data-i18n="tw4s"></span></div>
        </a>
        <a class="tile wide" href="more.html#tips">
          <img class="tile-logo" src="img/logo.svg" alt="">
          <div class="tile-badge"><div class="fig" data-fig="drink"></div></div>
          <div class="tile-text"><div class="tile-l1" data-i18n="tw5a"></div><div class="tile-l2" data-i18n="tw5b"></div><span class="tile-pill" data-i18n="tw5s"></span></div>
        </a>
        <a class="tile wide" href="more.html#faq">
          <img class="tile-logo" src="img/logo.svg" alt="">
          <div class="tile-badge"><div class="fig" data-fig="idle"></div></div>
          <div class="tile-text"><div class="tile-l1" data-i18n="tw6a"></div><div class="tile-l2" data-i18n="tw6b"></div><span class="tile-pill" data-i18n="tw6s"></span></div>
        </a>
      </div>
    </div>
  </section>

  <!-- How it works -->
  <section id="how">
    <div class="wrap">
      <div class="sec-head">
        <h2 data-i18n="howTitle"></h2>
        <p data-i18n="howSub"></p>
      </div>
      <div class="steps">
        <div class="step"><div class="num">1</div><h3 data-i18n="s1t"></h3><p data-i18n="s1d"></p></div>
        <div class="step"><div class="num">2</div><h3 data-i18n="s2t"></h3><p data-i18n="s2d"></p></div>
        <div class="step"><div class="num">3</div><h3 data-i18n="s3t"></h3><p data-i18n="s3d"></p></div>
      </div>
    </div>
  </section>
</main>

<script src="js/i18n.js?v=202611052010"></script>
<script src="js/data.js?v=202611052010"></script>
<script src="js/utils.js?v=202611052010"></script>
<script src="js/icons.js?v=202611052010"></script>
<script src="js/figures.js?v=202611052010"></script>
<script src="js/layout.js?v=202611052010"></script>
<script src="js/auth.js?v=202611052010"></script>
<script src="js/main.js?v=202611052010"></script>
</body>
</html>
