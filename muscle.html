<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สร้างกล้าม · FitStart AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="muscle">

<main>
  <div class="wrap page-hero">
    <span class="pill"><i data-icon="dumbbell"></i><span data-i18n="mPill"></span></span>
    <h1 data-i18n="mTitle"></h1>
    <p class="lead" data-i18n="mLead"></p>
  </div>

  <!-- Principles -->
  <section class="tight">
    <div class="wrap">
      <div class="sec-head"><h2 data-i18n="prinTitle"></h2></div>
      <div class="cards">
        <div class="tip"><div class="ico" data-icon="trending"></div><h3 data-i18n="mp1t"></h3><p data-i18n="mp1d"></p></div>
        <div class="tip"><div class="ico" data-icon="repeat"></div><h3 data-i18n="mp2t"></h3><p data-i18n="mp2d"></p></div>
        <div class="tip"><div class="ico" data-icon="calendar"></div><h3 data-i18n="mp3t"></h3><p data-i18n="mp3d"></p></div>
        <div class="tip"><div class="ico" data-icon="egg"></div><h3 data-i18n="mp4t"></h3><p data-i18n="mp4d"></p></div>
      </div>
    </div>
  </section>

  <!-- Protein calculator -->
  <section class="tight">
    <div class="wrap">
      <div class="panel">
        <h2 style="margin:0 0 4px;font-size:1.3rem" data-i18n="protTitle"></h2>
        <p style="margin:0 0 16px;color:var(--muted)" data-i18n="protSub"></p>
        <div class="calc-grid">
          <div class="field">
            <label for="pw" data-i18n="weight"></label>
            <input id="pw" type="number" inputmode="decimal" min="25" max="250" placeholder="60">
          </div>
        </div>
        <div id="protOut"></div>
      </div>
    </div>
  </section>

  <!-- Exercises -->
  <section class="tight">
    <div class="wrap">
      <div class="sec-head">
        <h2 data-i18n="exTitle"></h2>
        <p data-i18n="exSubM"></p>
      </div>
      <div id="exBrowser" data-cats="lower,upper,core"></div>
    </div>
  </section>

  <section class="tight">
    <div class="wrap">
      <div class="cta">
        <div><h2 data-i18n="mCta"></h2><p data-i18n="mCtaSub"></p></div>
        <a href="planner.html?goal=muscle" class="btn" data-i18n="mCtaBtn"></a>
      </div>
    </div>
  </section>
</main>

<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/icons.js"></script>
<script src="js/layout.js"></script>
<script src="js/auth.js"></script>
<script src="js/exercises.js"></script>
<script src="js/calculators.js"></script>
<script src="js/main.js"></script>
</body>
</html>
